name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux:
    name: Linux (Earthly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Earthly
        uses: earthly/actions/setup-earthly@v1
        with:
          version: latest

      - name: Run Earthly multi-distro tests
        run: earthly --ci +ci

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Setup Homebrew with cache
        uses: Homebrew/actions/setup-homebrew@v2
        with:
          cache: true

      - name: Install Python 3.13 via Homebrew
        run: |
          brew install python@3.13
          PYTHON_PREFIX="$(brew --prefix python@3.13)"
          echo "${PYTHON_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "PYTHONHOME=${PYTHON_PREFIX}/Frameworks/Python.framework/Versions/3.13" >> "$GITHUB_ENV"
          python3.13 --version

      - name: Sync dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run --with pytest pytest
