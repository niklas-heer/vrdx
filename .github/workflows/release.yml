name: Release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (Dagger + Dang)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: "0.21.9"
          verb: call
          args: release --target ${{ matrix.target }} export --path=dist
      - name: Verify extracted binary on Ubuntu host
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          smoke_dir=$(mktemp -d "${RUNNER_TEMP}/vrdx-release.XXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "dist/vrdx-v$(sed -n '/^version = "/{s/^version = "//;s/".*$//;p;q;}' Cargo.toml)-${RELEASE_TARGET}.tar.gz" -C "$smoke_dir"
          release_binary=$(find "$smoke_dir" -type f -name vrdx -perm -u+x)
          test -n "$release_binary"
          mkdir "$smoke_dir/collection"
          cd "$smoke_dir"
          "$release_binary" --help >/dev/null
          "$release_binary" --version
          "$release_binary" --dir "$smoke_dir/collection" new "Verify the release archive" --tag release
          "$release_binary" --dir "$smoke_dir/collection" validate
          "$release_binary" --dir "$smoke_dir/collection" context "How is the release verified?" --json >/dev/null
          "$release_binary" --dir "$smoke_dir/collection" guide --json >/dev/null
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
        with:
          version: "2026.9.5"
          install_args: rust
          cache: true
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - run: mise run package-release -- "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify version and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(sed -n '/^version = "/{s/^version = "//;s/".*$//;p;q;}' Cargo.toml)
          test "$RELEASE_TAG" = "v$package_version"
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
