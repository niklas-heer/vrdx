[project]
name = "vrdx"
version = "0.1.0"
description = "CLI tool for capturing and managing decision records in your repo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markdown-it-py>=3.0.0",
    "mdurl>=0.1.2",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "textual>=0.59.0",
]

[project.optional-dependencies]
dev = [
    "textual-dev>=1.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-watch>=4.2.0",
]

[project.scripts]
vrdx = "vrdx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
